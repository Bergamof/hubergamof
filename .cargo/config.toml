[env]
# Destination of the TypeScript bindings generated by ts-rs
# (`cargo test -p bergadeck-protocol export_bindings`), relative to the workspace root.
TS_RS_EXPORT_DIR = { value = "ui/src/lib/generated", relative = true }
# Messages travel as JSON, which the UI parses into plain numbers: 64-bit
# integers of the contract never exceed 2^53, so `bigint` would be wrong.
TS_RS_LARGE_INT = "number"
