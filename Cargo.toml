[workspace]
resolver = "3"
members = ["crates/protocol", "crates/module-api", "crates/modules", "crates/manager"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = ""
publish = false

[workspace.dependencies]
hubergamof-protocol = { path = "crates/protocol" }
hubergamof-module-api = { path = "crates/module-api" }
hubergamof-modules = { path = "crates/modules" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# Export archives: Deflate only, pure-Rust backend (no encryption, no other
# compression method is read or written).
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# D-Bus on the Tokio runtime only (no zbus runtime); crates add `proxy`,
# `service`, `p2p` as needed.
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Binaire installé plus léger. Une panique journalise toujours son message et
# son fichier:ligne (compilés dans le binaire) ; seules les traces complètes
# (`RUST_BACKTRACE`) perdent les noms de fonctions. Pas de `panic = "abort"` :
# les paniques des modules sont rattrapées et isolées par le moteur.
[profile.release]
strip = "symbols"
