[workspace]
resolver = "3"
members = ["crates/protocol", "crates/module-api", "crates/modules", "crates/mouse", "crates/manager"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = ""
publish = false

[workspace.dependencies]
hubergamof-protocol = { path = "crates/protocol" }
hubergamof-module-api = { path = "crates/module-api" }
hubergamof-modules = { path = "crates/modules" }
hubergamof-mouse = { path = "crates/mouse" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
# Hidraw access shared by the Stream Deck backend and the Logitech HID++ crate:
# the default Linux backend (bundled C sources + system libudev); hidapi accepts exactly one.
hidapi = "2.6.7"
# Virtual input device (/dev/uinput) behind a safe API: the code of this repository
# cannot use `unsafe`. (`evdev` pulls `bitvec`, flagged unmaintained.)
input-linux = "0.7.1"
libc = "0.2.191"
# Wayland client toolkit for the radial menu window; `xkbcommon` (system library) is left out: Escape is read from the raw key code.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# HTTPS client of the update check: rustls with the system trust store, no
# HTTP/2, charset detection nor JSON helper (the body is parsed by hand).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# Export archives: Deflate only, pure-Rust backend (no encryption, no other
# compression method is read or written).
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# D-Bus on the Tokio runtime only (no zbus runtime); crates add `proxy`,
# `service`, `p2p` as needed.
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Binaire installé plus léger. Une panique journalise toujours son message et
# son fichier:ligne (compilés dans le binaire) ; seules les traces complètes
# (`RUST_BACKTRACE`) perdent les noms de fonctions. Pas de `panic = "abort"` :
# les paniques des modules sont rattrapées et isolées par le moteur.
[profile.release]
strip = "symbols"
# Mesuré (2026-11-18) : binaire 18,1 Mo → 14,8 Mo pour le même temps de build.
lto = "thin"
codegen-units = 1
