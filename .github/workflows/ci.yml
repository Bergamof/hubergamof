# CI de vérification des PR (voir le skill regles-projet, references/ci.md).
# Les jobs appellent les cibles du Makefile : mêmes commandes en local et en CI.
# Chaque job de vérification expose `outputs.summary` (résumé chiffré) et figure
# dans les `needs` du job `report`, qui commente la PR.
#
# Actions : toutes épinglées par SHA de commit (chaîne d'approvisionnement, exigé
# par zizmor), version en commentaire ; Dependabot les met à jour.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Hebdomadaire : dérive des dépendances, de Docker et des runners hors PR.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # pnpm est installé par pnpm/action-setup (version de ui/package.json) : le
  # Makefile l'utilise directement au lieu de passer par Corepack.
  PNPM: pnpm
  CARGO_TERM_COLOR: never
  FORCE_COLOR: "0"
  # Outils hors Dependabot, montés à la main : version ET somme SHA-256 de
  # l'archive linux x64 (sha256sum de l'archive téléchargée, recoupée avec le
  # fichier de sommes de la release).
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # Installés par taiki-e/install-action (sommes vérifiées par l'action) ;
  # versions montées à la main, comme celles ci-dessus.
  ZIZMOR_VERSION: 1.31.1
  CARGO_LLVM_COV_VERSION: 0.9.1

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: debug
      - uses: ./.github/actions/setup-ui

      - name: Rust (rustfmt, clippy)
        id: rust
        run: make lint-rust 2>&1 | tee lint-rust.log
      - name: UI (Prettier, ESLint, svelte-check)
        id: ui
        if: ${{ !cancelled() }}
        run: make lint-ui 2>&1 | tee lint-ui.log
      - name: Lancement de shell interdit hors tests
        id: shell-exec
        if: ${{ !cancelled() }}
        run: make lint-shell-exec
      - name: Versions (Dockerfile ↔ rust-toolchain.toml, .nvmrc)
        id: versions
        if: ${{ !cancelled() }}
        run: make check-versions
      # Nom parlant obligatoire (voir check-branch-name.sh) ; `main` et Dependabot admis.
      - name: Nom de la branche
        id: branch
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: .github/scripts/check-branch-name.sh "$BRANCH"
      - name: Install actionlint
        if: ${{ !cancelled() }}
        run: >-
          .github/scripts/install-release-binary.sh rhysd/actionlint "v$ACTIONLINT_VERSION"
          "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          "$ACTIONLINT_SHA256" actionlint
      # actionlint vérifie aussi les scripts `run:` avec shellcheck (préinstallé sur le runner).
      - name: Pipeline (actionlint, shellcheck)
        id: tooling
        if: ${{ !cancelled() }}
        run: |
          actionlint
          shellcheck --external-sources --source-path=SCRIPTDIR/.. packaging/*.sh packaging/package/*.sh .github/scripts/*.sh
          make test-scripts
      - name: Install zizmor
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}
      - name: Workflows (zizmor)
        id: workflows
        if: ${{ !cancelled() }}
        run: make lint-workflows 2>&1 | tee zizmor.log

      - name: Summary
        id: summary
        if: always()
        env:
          RUST: ${{ steps.rust.outcome }}
          UI: ${{ steps.ui.outcome }}
          SHELL_EXEC: ${{ steps.shell-exec.outcome }}
          VERSIONS: ${{ steps.versions.outcome }}
          BRANCH: ${{ steps.branch.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          WORKFLOWS: ${{ steps.workflows.outcome }}
        run: |
          icon() { [[ "$1" == success ]] && echo "✅" || echo "❌"; }
          rust_issues=$(grep -cE '^(error|warning)(\[[A-Za-z0-9_:]+\])?: ' lint-rust.log || true)
          ui_problems=$(sed -nE 's/.*✖ ([0-9]+) problems?.*/\1/p' lint-ui.log 2>/dev/null | tail -1)
          # svelte-check sans terminal : « COMPLETED n FILES e ERRORS w WARNINGS … ».
          svelte_check=$(sed -nE 's/.*COMPLETED [0-9]+ FILES ([0-9]+) ERRORS ([0-9]+) WARNINGS.*/\1 erreur(s), \2 avertissement(s)/p' lint-ui.log 2>/dev/null | tail -1)
          zizmor=$(grep -oE '^[0-9]+ findings?' zizmor.log 2>/dev/null | tail -1 || true)
          echo "summary=Rust $(icon "$RUST") ${rust_issues:-0} diagnostic(s) · ESLint $(icon "$UI") ${ui_problems:-0} problème(s), svelte-check ${svelte_check:-—} · shell hors tests $(icon "$SHELL_EXEC") · versions $(icon "$VERSIONS") · branche $(icon "$BRANCH") · pipeline $(icon "$TOOLING") · zizmor $(icon "$WORKFLOWS") ${zizmor:-0 finding}" >> "$GITHUB_OUTPUT"

  # Les tests tournent instrumentés (doctests à part) : mêmes tests que `make test`, plus la
  # couverture, en échec sous le plancher (cliquet, voir Makefile et vite.config.ts).
  test:
    name: Tests & couverture
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: coverage
      - uses: ./.github/actions/setup-ui
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      # Composants Svelte testés dans un vrai Chromium (mode navigateur de Vitest).
      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Rust (cargo llvm-cov)
        id: rust
        run: make coverage-rust 2>&1 | tee test-rust.log
      - name: UI (Vitest, couverture v8)
        id: ui
        if: ${{ !cancelled() }}
        run: make coverage-ui 2>&1 | tee test-ui.log

      - name: Summary
        id: summary
        if: always()
        run: |
          rust=$(awk '/^test result:/ { passed += $4; failed += $6 } END { printf "%d réussi(s), %d échoué(s)", passed, failed }' test-rust.log 2>/dev/null || echo "—")
          # Ligne TOTAL de cargo llvm-cov : régions, fonctions puis lignes ; garder le dernier pourcentage.
          rust_lines=$(awk '/^TOTAL/ { n = 0; for (i = 1; i <= NF; i++) if ($i ~ /%$/) pct[++n] = $i; print pct[n] }' test-rust.log 2>/dev/null)
          vitest=$(grep -E '^[[:space:]]*Tests[[:space:]]' test-ui.log 2>/dev/null | tail -1 | sed -E 's/^[[:space:]]*Tests[[:space:]]+//' || true)
          ui_lines=$(sed -nE 's/^Lines[[:space:]]*:[[:space:]]*([0-9.]+%).*/\1/p' test-ui.log 2>/dev/null | tail -1)
          echo "summary=Rust : ${rust}, lignes ${rust_lines:-—} · Vitest : ${vitest:-—}, lignes ${ui_lines:-—}" >> "$GITHUB_OUTPUT"

  contract:
    name: Contrat TS
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: debug
      - name: Generated TypeScript types are up to date
        id: check
        run: make check-types 2>&1 | tee check-types.log
      - name: Summary
        id: summary
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          files=$(find ui/src/lib/generated -name '*.ts' 2>/dev/null | wc -l)
          if [[ "$OUTCOME" == success ]]; then
            echo "summary=${files} fichier(s) généré(s), à jour" >> "$GITHUB_OUTPUT"
          else
            diverging=$(grep -cE '^(diff |Only in )' check-types.log || true)
            echo "summary=${diverging} fichier(s) divergent(s) : lancer make gen-types" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Tests e2e (Playwright)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ui
      # Les tests « demo » tournent contre `hubergamof --demo` (cargo run, binaire debug).
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: debug
      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        id: e2e
        run: make test-e2e 2>&1 | tee e2e.log
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
      - name: Summary
        id: summary
        if: always()
        run: |
          passed=$(sed -nE 's/^[[:space:]]*([0-9]+) passed.*/\1/p' e2e.log 2>/dev/null | tail -1)
          failed=$(sed -nE 's/^[[:space:]]*([0-9]+) failed.*/\1/p' e2e.log 2>/dev/null | tail -1)
          echo "summary=${passed:-0} réussi(s), ${failed:-0} échoué(s)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - uses: ./.github/actions/setup-ui
      # UI d'abord, puis binaire release qui l'embarque.
      - name: make build
        id: build
        run: make build
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hubergamof-linux-x86_64
          path: target/release/hubergamof
          retention-days: 7
      - name: Summary
        id: summary
        if: always()
        run: |
          binary=$(du -h target/release/hubergamof 2>/dev/null | cut -f1)
          ui=$(du -sh ui/build 2>/dev/null | cut -f1)
          echo "summary=binaire ${binary:-absent}, UI ${ui:-absente}" >> "$GITHUB_OUTPUT"

  package:
    name: Paquets
    # 24.04 explicitement (et non latest) : c'est la plus ancienne glibc visée,
    # comme dans release.yml ; un binaire construit plus récent ne tournerait pas
    # sur Manjaro stable.
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - uses: ./.github/actions/setup-ui
      - name: Install packaging tools
        run: sudo apt-get install --yes --no-install-recommends lintian
      - name: make build
        run: make build
      - name: Build packages
        run: make package
      - name: Lint the .deb
        run: make package-lint
      # Installe chaque paquet dans un conteneur propre (Ubuntu 24.04, Arch) :
      # dépendances résolues, binaire lançable, unité et règle udev valides.
      - name: Install packages in clean containers
        run: make package-smoke
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          retention-days: 7
      - name: Summary
        id: summary
        if: always()
        run: |
          packages=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.pkg.tar.zst' \) 2>/dev/null | wc -l)
          echo "summary=${packages} paquet(s) construit(s), installation testée" >> "$GITHUB_OUTPUT"

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    env:
      IMAGE: hubergamof:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (--version)
        id: version
        run: docker run --rm "$IMAGE" --version | tee version.txt
      # Le serveur n'écoute que sur 127.0.0.1 : conteneur sur le réseau de l'hôte,
      # requête avec un Host autorisé (contrôle strict Host/Origin).
      - name: Smoke test (--demo, HTTP)
        id: http
        env:
          PORT: "7878"
          MAX_ATTEMPTS: "30"
        run: |
          docker run --detach --name hubergamof-smoke --network host "$IMAGE" --demo --no-tray --port "$PORT"
          trap 'docker logs hubergamof-smoke; docker rm --force hubergamof-smoke >/dev/null' EXIT
          url="http://127.0.0.1:${PORT}/"
          # Attente bornée du démarrage (1 s entre deux tentatives).
          status=000
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: 127.0.0.1:${PORT}" "$url" || true)
            [[ "$status" == 000 ]] || break
            sleep 1
          done
          echo "HTTP ${status} en $((attempt > MAX_ATTEMPTS ? MAX_ATTEMPTS : attempt)) tentative(s)" | tee http.txt
          [[ "$status" == 200 ]]
      # Les CVE sans correctif publié ne sont pas actionnables : seules les
      # HIGH/CRITICAL corrigeables font échouer le job.
      - name: Scan image (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-image.json
      - name: Trivy findings
        if: ${{ !cancelled() && hashFiles('trivy-image.json') != '' }}
        run: jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) → \(.FixedVersion)\t\($t)"' trivy-image.json
      - name: Summary
        id: summary
        if: always()
        env:
          VERSION: ${{ steps.version.outcome }}
          HTTP: ${{ steps.http.outcome }}
        run: |
          icon() { [[ "$1" == success ]] && echo "✅" || echo "❌"; }
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}' 2>/dev/null | numfmt --to=iec || true)
          http=$(cat http.txt 2>/dev/null || true)
          cves=$(jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | "\(map(select(. == "CRITICAL")) | length) CRITICAL, \(map(select(. == "HIGH")) | length) HIGH"' trivy-image.json 2>/dev/null || true)
          echo "summary=image ${size:-non construite} · --version $(icon "$VERSION") · --demo $(icon "$HTTP") ${http:-—} · CVE corrigeables : ${cves:-—}" >> "$GITHUB_OUTPUT"

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet pour le scan de secrets.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: debug
      - uses: ./.github/actions/setup-ui
        with:
          install: "false"
      - name: Install cargo-deny
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20

      - name: Rust dependencies (cargo deny)
        id: deny
        run: make deny 2>&1 | tee deny.log
      - name: UI dependencies (pnpm audit)
        id: audit
        if: ${{ !cancelled() }}
        working-directory: ui
        run: |
          pnpm audit --json > ../pnpm-audit.json || true
          pnpm audit --audit-level high
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: >-
          .github/scripts/install-release-binary.sh gitleaks/gitleaks "v$GITLEAKS_VERSION"
          "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          "$GITLEAKS_SHA256" gitleaks
      - name: Secrets (gitleaks)
        id: gitleaks
        if: ${{ !cancelled() }}
        run: gitleaks git --redact --no-banner --report-format json --report-path gitleaks.json
      - name: Lockfiles & IaC (Trivy fs)
        id: trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          # target/ (cache Rust restauré) n'est pas une source : Cargo.lock est scanné.
          skip-dirs: target
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Summary
        id: summary
        if: always()
        env:
          DENY: ${{ steps.deny.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
        run: |
          icon() { [[ "$1" == success ]] && echo "✅" || echo "❌"; }
          deny_errors=$(grep -cE '^error\[' deny.log 2>/dev/null || true)
          audit=$(jq -r '.metadata.vulnerabilities // empty | "\(.critical // 0) critique(s), \(.high // 0) haute(s), \(.moderate // 0) moyenne(s)"' pnpm-audit.json 2>/dev/null || true)
          leaks=$(jq 'length' gitleaks.json 2>/dev/null || true)
          echo "summary=cargo-deny $(icon "$DENY") ${deny_errors:-0} erreur(s) · pnpm audit $(icon "$AUDIT") ${audit:-—} · gitleaks $(icon "$GITLEAKS") ${leaks:-—} secret(s) · Trivy fs $(icon "$TRIVY")" >> "$GITHUB_OUTPUT"

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: debug
      # Assertions (Accessibilité et Bonnes pratiques ≥ 0,9) dans lighthouserc.json.
      # Audit de l'UI servie par `hubergamof --demo` (startServerCommand), éditeur affiché.
      - name: Lighthouse CI
        id: lhci
        run: make lighthouse
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
      - name: Summary
        id: summary
        if: always()
        run: |
          # Score le plus bas parmi les pages auditées (run représentatif de chacune).
          scores=$(jq -r '[.[] | select(.isRepresentativeRun) | .summary] as $runs
            | def lowest(category): $runs | map(.[category]) | min * 100 | round;
            "\($runs | length) page(s) · A11y \(lowest("accessibility")) · Bonnes pratiques \(lowest("best-practices")) · Perf \(lowest("performance")) · SEO \(lowest("seo"))"' \
            .lighthouseci/reports/manifest.json 2>/dev/null || true)
          echo "summary=${scores:-pas de rapport}" >> "$GITHUB_OUTPUT"

  # Le module Docker contre un vrai démon (feature `docker-it`) : sur une PR
  # seulement si elle touche ce qu'il exerce, toujours sur main et chaque semaine.
  docker-it:
    name: Intégration Docker
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Concerned?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          relevant='^(crates/modules/(src/docker/|src/(background|process|trust|paths)\.rs|tests/docker_engine\.rs|Cargo\.toml)|crates/module-api/|Cargo\.lock|rust-toolchain\.toml|Makefile|\.github/)'
          # Trois points : depuis l'ancêtre commun, pas ce que main a reçu depuis.
          if [[ "$EVENT" != pull_request ]] || git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE "$relevant"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-rust
        if: steps.scope.outputs.run == 'true'
        with:
          cache-key: debug
      - name: Docker (cargo test --features docker-it)
        id: it
        if: steps.scope.outputs.run == 'true'
        run: make test-docker 2>&1 | tee docker-it.log
      - name: Summary
        id: summary
        if: always()
        env:
          RUN: ${{ steps.scope.outputs.run }}
        run: |
          if [[ "$RUN" != true ]]; then
            echo "summary=non concerné (module Docker inchangé)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker_version=$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)
          result=$(awk '/^test result:/ { passed += $4; failed += $6 } END { printf "%d réussi(s), %d échoué(s)", passed, failed }' docker-it.log 2>/dev/null || echo "—")
          echo "summary=${result} · Docker ${docker_version:-—}" >> "$GITHUB_OUTPUT"

  report:
    name: Compte rendu
    needs: [lint, test, contract, e2e, build, package, docker, docker-it, security, lighthouse]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Commente la PR avec le compte rendu.
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            try {
              const needs = JSON.parse(process.env.NEEDS);
              const icons = { success: '✅', failure: '❌', cancelled: '⚠️', skipped: '⏭️' };
              const results = Object.values(needs).map(n => n.result);
              const global = results.every(r => r === 'success') ? '✅'
                : results.includes('failure') ? '❌' : '⚠️';
              const rows = Object.entries(needs).map(([job, n]) =>
                `| ${job} | ${icons[n.result] ?? '❔'} ${n.result} | ${n.outputs?.summary || '—'} |`);
              const sha = context.payload.pull_request.head.sha.slice(0, 7);
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = [
                `## ${global} Compte rendu CI`,
                '',
                `Commit testé : \`${sha}\` — [logs détaillés](${runUrl})`,
                '',
                '| Vérification | Résultat | Résumé |',
                '|---|---|---|',
                ...rows,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (error) {
              // Le compte rendu reflète les résultats sans les juger : il ne fait jamais échouer la CI.
              core.warning(`Commentaire de compte rendu non publié : ${error.message}`);
            }
