name: Setup UI
description: >-
  Installe pnpm (version de packageManager dans ui/package.json) et Node
  (version de .nvmrc) avec cache du store pnpm, puis les dépendances de l'UI.
inputs:
  install:
    description: Installer les dépendances (pnpm install --frozen-lockfile).
    required: false
    default: "true"
  cache:
    description: Mettre en cache le store pnpm (désactivé pour le build de release).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: ui/package.json

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ui/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ui
      run: pnpm install --frozen-lockfile
