name: Setup UI
description: >-
  Installe pnpm (version de packageManager dans ui/package.json) et Node
  (version de .nvmrc) avec cache du store pnpm, puis les dépendances de l'UI.
inputs:
  install:
    description: Installer les dépendances (pnpm install --frozen-lockfile).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ui/package.json

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: ui/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ui
      run: pnpm install --frozen-lockfile
