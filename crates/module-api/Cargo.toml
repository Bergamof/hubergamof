[package]
name = "bergadeck-module-api"
description = "API implemented by Bergadeck modules (built-in and external)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Deliberately more permissive than the rest of the workspace so that
# third-party modules are not forced under the GPL. For the same reason this
# crate must never depend on a GPL crate of the workspace.
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `rt` for the task scope of module instances (`JoinSet`), nothing else.
tokio = { workspace = true, features = ["rt"] }
# TypeScript bindings of the catalog types, enabled by `bergadeck-protocol`
# (the wire contract); modules do not need them.
ts-rs = { workspace = true, optional = true }

[features]
# Derives `ts_rs::TS` on the types that are part of the wire contract.
ts = ["dep:ts-rs"]
# `testing::TestContext`, for the tests of modules (channels need `sync`).
testing = ["tokio/sync"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
