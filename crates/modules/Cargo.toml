[package]
name = "bergadeck-modules"
description = "Built-in Bergadeck modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bergadeck-module-api.workspace = true
# Local time in the system time zone (`/etc/localtime`, system tzdb).
jiff = "0.2.38"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `process` + `io-util`: the audio module drives `pactl`.
tokio = { workspace = true, features = ["io-util", "macros", "process", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }

[lints]
workspace = true
