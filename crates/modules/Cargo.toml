[package]
name = "bergadeck-modules"
description = "Built-in Bergadeck modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bergadeck-module-api.workspace = true
# Local time in the system time zone (`/etc/localtime`, system tzdb).
jiff = "0.2.38"
serde.workspace = true
serde_json.workspace = true
# `CLOCK_BOOTTIME` (monotonic, counting suspends) for the pomodoro.
rustix = { version = "1.1.6", default-features = false, features = ["std", "time"] }
thiserror.workspace = true
# `process` + `io-util`: the audio module drives `pactl`.
tokio = { workspace = true, features = ["io-util", "macros", "process", "sync", "time"] }
tracing.workspace = true
# Desktop notifications (`org.freedesktop.Notifications`) of the pomodoro.
zbus = { workspace = true, features = ["proxy"] }

[dev-dependencies]
bergadeck-module-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }
# Peer-to-peer connections: notifications are checked without a bus daemon.
zbus = { workspace = true, features = ["p2p", "proxy", "service"] }

[lints]
workspace = true
