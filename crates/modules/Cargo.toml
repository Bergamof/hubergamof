[package]
name = "bergadeck-modules"
description = "Built-in Bergadeck modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bergadeck-module-api.workspace = true
# Docker Engine API over the local Unix socket only (`DOCKER_HOST=unix://…`).
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
# Event stream of `bollard`, and running several container actions at once.
futures-util.workspace = true
# Local time in the system time zone (`/etc/localtime`, system tzdb).
jiff = "0.2.38"
serde.workspace = true
serde_json.workspace = true
# `CLOCK_BOOTTIME` (monotonic, counting suspends) for the pomodoro; the
# uid of the user, owner of the compose files Docker may run; `fs`: the
# KWin scripts are written relative to checked folders (`openat`).
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std", "time"] }
thiserror.workspace = true
# `process` + `io-util`: the audio module drives `pactl`, the Docker module
# `docker compose`; `fs`: the compose files are checked before.
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "sync", "time"] }
tracing.workspace = true
# Desktop notifications (`org.freedesktop.Notifications`) of the pomodoro;
# `service`: the object receiving the window reports of the KWin script.
zbus = { workspace = true, features = ["proxy", "service"] }

[dev-dependencies]
bergadeck-module-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# `net`: a fake Docker daemon on a Unix socket.
tokio = { workspace = true, features = ["net", "rt", "test-util"] }
# Peer-to-peer connections: notifications are checked without a bus daemon.
zbus = { workspace = true, features = ["p2p", "proxy", "service"] }

[lints]
workspace = true
