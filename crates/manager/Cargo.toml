[package]
name = "hubergamof"
description = "Stream Deck manager for Linux with a live web configuration UI."
version.workspace = true
# Two binaries (the manager and the root update helper): `cargo run` starts the manager.
default-run = "hubergamof"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The device, rendering, configuration and engine layers live in a library so
# that their public API is documented and tested on its own; the binary wires
# them.
[lib]
name = "hubergamof_manager"
path = "src/lib.rs"

[[bin]]
name = "hubergamof"
path = "src/main.rs"

# Runs as root, started by systemd for each connection to
# hubergamof-update.socket: kept apart from the manager so that the code with
# privileges stays small.
[[bin]]
name = "hubergamof-update-helper"
path = "src/bin/hubergamof-update-helper.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# HTTP/1 + WebSocket only: no JSON/form extractors (messages are parsed by hand
# to answer `invalidMessage` instead of rejecting the request).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tracing", "ws"] }
base64.workspace = true
hubergamof-module-api.workspace = true
hubergamof-modules.workspace = true
hubergamof-mouse.workspace = true
hubergamof-protocol.workspace = true
clap.workspace = true
# Release signature check of the update helper (runs as root): verification
# only, no key generation, no serialisation.
ed25519-dalek = { version = "3.0.0", default-features = false }
# Synchronous API driven from a dedicated thread per device: the crate's
# `async` feature relies on `block_in_place` and serialises reads and writes.
elgato-streamdeck = { version = "0.14.0", default-features = false }
# `StreamExt` for the D-Bus signal streams of the tray; `std` for
# `FutureExt::catch_unwind` around module handlers.
futures-util.workspace = true
# Default backend (`linux-static-hidraw`, bundled C sources + system libudev):
# elgato-streamdeck enables it and hidapi accepts exactly one Linux backend.
hidapi.workspace = true
image.workspace = true
input-linux.workspace = true
# Local time in the system time zone (`/etc/localtime`, system tzdb), for the
# clock of the touch strip.
jiff = "0.2.38"
libc.workspace = true
lru = "0.19.0"
mime_guess = "2.0.5"
reqwest.workspace = true
# umask and the receive timeout of the helper's socket (the update helper).
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
# SVG rendering without system fonts nor embedded raster images (untrusted input).
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
# `allow_missing`: the UI build (`ui/build/`) may be absent (Rust-only CI jobs).
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
smithay-client-toolkit.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
x11rb.workspace = true
# System tray (StatusNotifierItem + dbusmenu) on the Tokio runtime only, without
# zbus's own runtime nor the ObjectManager.
zbus = { workspace = true, features = ["proxy", "service"] }
zip.workspace = true

[dev-dependencies]
hubergamof-mouse = { workspace = true, features = ["test-support"] }
futures-util = { workspace = true, features = ["sink"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.30.0"
# Peer-to-peer connections: the tray objects are exercised without a bus daemon.
zbus = { workspace = true, features = ["p2p", "proxy", "service"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
